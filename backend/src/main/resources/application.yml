server:
  port: 8088

# 附件（物资照片、说明书、入库发票等）保存目录
app:
  upload-dir: ./uploads

# 演示环境可零配置启动；部署时通过环境变量覆盖，避免仓库保存真实密码
jwt:
  secret: ${JWT_SECRET:MaterialBorrowSystem2024SecretKeyForJWT!!_32bytes}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/material_borrow?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
