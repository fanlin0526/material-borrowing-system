server:
  port: 8088

# JWT 配置（可选，不配置则使用内置默认密钥）
# jwt:
#   secret: 请替换为你的自定义密钥（至少32字符）

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/material_borrow?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
